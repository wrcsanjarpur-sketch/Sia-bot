<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sia AI Assistant</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #000; font-family: 'Segoe UI', sans-serif; height: 100vh; color: white; overflow: hidden; display: flex; flex-direction: column; }

        /* Main AI View */
        #main-display { flex: 1; position: relative; background: #111; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #ai-image { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        
        /* Floating Camera (Top Right) */
        #user-cam-box { position: absolute; top: 15px; right: 15px; width: 90px; height: 120px; border-radius: 10px; border: 2px solid #00ff7f; overflow: hidden; z-index: 100; background: #000; }
        #user-video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        /* Top Tools (Flash, Switch, Pause) */
        .side-tools { position: absolute; top: 15px; left: 15px; display: flex; flex-direction: column; gap: 12px; z-index: 101; }
        .icon-btn { background: rgba(0,0,0,0.6); border: 1px solid #555; color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }

        /* Status Tag */
        #status-tag { position: absolute; top: 15px; left: 70px; background: rgba(0,255,127,0.2); color: #00ff7f; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; border: 1px solid #00ff7f; }

        /* Call Controls */
        .call-actions { position: absolute; bottom: 180px; width: 100%; display: flex; justify-content: center; gap: 15px; z-index: 90; }
        .action-btn { padding: 12px 25px; border-radius: 30px; border: none; font-weight: bold; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #v-call { background: #2ecc71; }
        #a-call { background: #3498db; }

        /* Chat Section */
        #chat-section { height: 160px; background: #1a1a1a; border-top: 1px solid #333; padding: 10px; display: flex; flex-direction: column; }
        #log { flex: 1; overflow-y: auto; font-size: 13px; color: #aaa; margin-bottom: 5px; }
        .input-row { display: flex; gap: 10px; }
        #text-input { flex: 1; background: #333; border: none; border-radius: 20px; padding: 10px 15px; color: white; outline: none; }
        #send-btn { background: #00ff7f; border: none; width: 40px; height: 40px; border-radius: 50%; color: #000; font-weight: bold; }

        .talking { filter: brightness(1.2); box-shadow: inset 0 0 50px #00ff7f; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="main-display">
        <!-- AI European Girl -->
        <img id="ai-image" src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=600&q=80">
        
        <!-- Status -->
        <div id="status-tag">READY</div>

        <!-- Floating Camera -->
        <div id="user-cam-box">
            <video id="user-video" autoplay playsinline muted></video>
        </div>

        <!-- Tools -->
        <div class="side-tools">
            <button class="icon-btn" onclick="toggleFlash()">🔦</button>
            <button class="icon-btn" onclick="switchCam()">🔄</button>
            <button class="icon-btn" id="pause-btn" onclick="togglePause()">⏸️</button>
        </div>

        <!-- Call Buttons -->
        <div class="call-actions" id="controls">
            <button class="action-btn" id="v-call" onclick="startCall('video')">📹 Video Call</button>
            <button class="action-btn" id="a-call" onclick="startCall('voice')">📞 Voice Call</button>
        </div>
    </div>

    <!-- Chat -->
    <div id="chat-section">
        <div id="log">System: Sia is ready to help.</div>
        <div class="input-row">
            <input type="text" id="text-input" placeholder="Say something...">
            <button id="send-btn" onclick="handleTextChat()">➔</button>
        </div>
    </div>

    <script>
        // Internal Browser Speech Setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        const synth = window.speechSynthesis;
        
        recognition.continuous = false;
        recognition.lang = 'en-US'; // Roman Urdu bhi samajh leta hai

        let isPaused = false;
        let camMode = "user";
        let stream = null;
        let flash = false;
        let callActive = false;

        // Init Camera
        async function initCam() {
            try {
                if (stream) stream.getTracks().forEach(t => t.stop());
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: camMode }, 
                    audio: true 
                });
                document.getElementById('user-video').srcObject = stream;
            } catch (e) {
                addLog("Camera blocked.");
            }
        }

        // Start Call Logic
        function startCall(type) {
            callActive = true;
            document.getElementById('controls').classList.add('hidden');
            document.getElementById('status-tag').innerText = "LIVE";
            
            if(type === 'voice') {
                document.getElementById('user-cam-box').classList.add('hidden');
                document.getElementById('ai-image').style.filter = "grayscale(1) blur(5px)";
            }
            
            speak("Hello! I am Sia, your European assistant. How can I help you today?");
            setTimeout(() => startListening(), 4000);
        }

        // AI Voice (Talking)
        function speak(text) {
            if(isPaused) return;
            const utter = new SpeechSynthesisUtterance(text);
            const voices = synth.getVoices();
            // Try to find a female European voice
            utter.voice = voices.find(v => v.name.contains("Female") || v.name.contains("Google UK English Female")) || voices[0];
            utter.pitch = 1.1;
            utter.rate = 1;

            utter.onstart = () => document.getElementById('ai-image').classList.add('talking');
            utter.onend = () => {
                document.getElementById('ai-image').classList.remove('talking');
                if(callActive) startListening();
            };
            
            synth.speak(utter);
        }

        // AI Hearing (Listening)
        function startListening() {
            if(isPaused || synth.speaking) return;
            recognition.start();
        }

        recognition.onresult = (event) => {
            const result = event.results[0][0].transcript;
            addLog("You: " + result);
            processAI(result);
        };

        // Simple Brain (Aap yahan mazeed jawab daal sakte hain)
        function processAI(input) {
            let reply = "That's interesting, tell me more.";
            const msg = input.toLowerCase();
            
            if(msg.includes("hello") || msg.includes("hi")) reply = "Hello there! Nice to see you.";
            if(msg.includes("how are you")) reply = "I am doing great, looking at you makes me happy.";
            if(msg.includes("name")) reply = "My name is Sia.";
            
            speak(reply);
            addLog("Sia: " + reply);
        }

        // Tools Functions
        async function toggleFlash() {
            if(camMode === 'user') return alert("Switch to Back Camera first!");
            const track = stream.getVideoTracks()[0];
            flash = !flash;
            try { await track.applyConstraints({ advanced: [{ torch: flash }] }); } 
            catch (e) { addLog("Flash not supported."); }
        }

        function switchCam() {
            camMode = (camMode === "user") ? "environment" : "user";
            initCam();
            document.getElementById('user-video').style.transform = (camMode === "user") ? "scaleX(-1)" : "scaleX(1)";
        }

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pause-btn').innerText = isPaused ? "▶️" : "⏸️";
            if(isPaused) { synth.cancel(); recognition.stop(); }
            else { speak("Resuming call."); }
        }

        function handleTextChat() {
            const input = document.getElementById('text-input');
            if(!input.value) return;
            addLog("You: " + input.value);
            processAI(input.value);
            input.value = "";
        }

        function addLog(m) {
            const l = document.getElementById('log');
            l.innerHTML += `<div>${m}</div>`;
            l.scrollTop = l.scrollHeight;
        }

        window.onload = () => {
            initCam();
            // Voice load fix
            synth.getVoices();
        };
    </script>
</body>
</html>
